name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # commit the content bundle and the generated android/ folder
  id-token: write   # GitHub OIDC token for the publish-content function

env:
  SUPABASE_URL: https://jmczkzlzvwkfbxsiftls.supabase.co
  PUBLISH_AUDIENCE: islamic-kids-app-publish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the content pipeline
        run: node --test pipeline/pipeline.test.mjs

      # If QuranEnc or HadeethEnc is down, build with the last committed
      # bundle instead of failing the whole build.
      - name: Build the content bundle from QuranEnc and HadeethEnc
        run: |
          set -o pipefail
          # 2>&1: the pipeline reports problems on stderr; keep them in the log.
          if node pipeline/build-bundle.mjs 2>&1 | tee pipeline.log; then
            echo "::notice title=Content bundle::$(tail -n 1 pipeline.log)"
            echo "::notice title=References and mushaf::$(grep -E '^(references|mushaf):' pipeline.log | tr '\n' ';')"
          else
            # Job logs cannot be read from outside GitHub, so put the end of
            # the log in an annotation (one annotation, newlines encoded).
            tail_log=$(grep -vE '^(surah|hadith|dua moment) ' pipeline.log | tail -n 25 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Content bundle failed (last lines)::${tail_log}"
            echo "::warning title=Content bundle::Fetch or validation failed; using the committed bundle"
            git checkout -- app/assets/content/bundle.json
          fi

      # bundleVersion and generatedAt change on every run. When the content
      # itself is unchanged, keep the committed file so its version and hash
      # stay stable and phones are not told to re-download the same text.
      - name: Keep the committed bundle if only timestamps changed
        run: |
          if git cat-file -e HEAD:app/assets/content/bundle.json 2>/dev/null; then
            git show HEAD:app/assets/content/bundle.json | node pipeline/strip-stamps.mjs > "$RUNNER_TEMP/old.json"
            node pipeline/strip-stamps.mjs < app/assets/content/bundle.json > "$RUNNER_TEMP/new.json"
            if cmp -s "$RUNNER_TEMP/old.json" "$RUNNER_TEMP/new.json"; then
              git checkout -- app/assets/content/bundle.json
              echo "Content unchanged"
            fi
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch fonts (SIL Open Font License)
        run: node tool/fetch-fonts.mjs

      # A glyph missing from the Quran font draws an empty box in the text.
      - name: Check the Quran font covers every Arabic character
        run: |
          python3 -m venv "$RUNNER_TEMP/ft"
          "$RUNNER_TEMP/ft/bin/pip" install --quiet fonttools
          "$RUNNER_TEMP/ft/bin/python" tool/check-font-coverage.py app/assets/fonts/ScheherazadeNew-Regular.ttf app/assets/content/bundle.json

      # One-off: generate android/ when it is not in the repo yet. It is then
      # committed, so manifest, app id and signing changes are versioned.
      - name: Generate the Android project if missing
        working-directory: app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --org com.jibrilmohamod --project-name islamic_kids_app .
            # Release builds need INTERNET for content updates and YouTube.
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' android/app/src/main/AndroidManifest.xml
          fi
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      # Findings become annotations on the run, so they are readable without
      # downloading the log.
      - name: Analyze
        working-directory: app
        run: |
          set +e
          flutter pub get > /dev/null
          dart analyze --format=machine . > "$RUNNER_TEMP/analyze.txt" 2>&1
          awk -F'|' 'NF>=8 && $1!="INFO" { f=$4; sub(/.*\/app\//,"app/",f); printf "::%s file=%s,line=%s,col=%s,title=%s::%s\n", ($1=="ERROR"?"error":"warning"), f, $5, $6, $3, $8 }' "$RUNNER_TEMP/analyze.txt"
          flutter analyze --no-fatal-infos

      - name: Test
        working-directory: app
        timeout-minutes: 15
        run: |
          set -o pipefail
          # A hung test fails in 90 s with its name, instead of stalling the
          # job (pumpAndSettle waits up to 10 minutes by default).
          if ! flutter test --timeout 90s --file-reporter json:test-results.json; then
            node ../tool/test-failures.mjs test-results.json
            exit 1
          fi

      # Screenshots of key screens with the real fonts and content, pushed to
      # the "previews" branch so the work can be looked at without a phone.
      - name: Render screen previews
        if: env.ON_MAIN == 'true' || github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          if ! flutter test --timeout 90s --update-goldens test_screens/ 2>&1 | tee previews.log; then
            # Logs cannot be read from outside GitHub: name the failing screen here.
            msg=$(grep -E '\[E\]|EXCEPTION CAUGHT|overflowed|Expected:|Actual:|^  ' previews.log | head -25 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=A screen preview failed::${msg}"
            exit 1
          fi

      - name: Publish previews
        if: env.ON_MAIN == 'true' || github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/previews"
          rm -rf "$d" && mkdir -p "$d"
          cp app/test_screens/goldens/*.png "$d"/
          cd "$d"
          echo "Screens from ${GITHUB_SHA} (${GITHUB_HEAD_REF:-main})" > README.md
          git init -q -b previews
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Previews for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previews
          echo "::notice title=Previews::$(ls *.png | tr '\n' ' ')"

      # Release signing uses an upload key kept only in GitHub secrets.
      # Until those secrets exist the APK stays debug-signed.
      - name: Set up release signing when the key exists
        id: signing
        if: env.ON_MAIN == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=Signing::No release key in secrets yet; the APK is debug-signed"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > app/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Logs cannot be read from outside GitHub: put Gradle's reason in an annotation.
            msg=$(grep -A12 -E "What went wrong|error:|Error:|FAILURE" build.log | head -40 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=APK build failed::${msg}"
            exit 1
          fi

      # Plugins can add permissions at build time. List what the finished APK
      # asks for, and flag anything not on the reviewed list (audit P1).
      - name: Check the APK's permissions
        working-directory: app
        continue-on-error: true
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          perms=$("$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk | sed -n "s/.*name='\([^']*\)'.*/\1/p" | sort -u)
          echo "::notice title=APK permissions::$(echo "$perms" | tr '\n' ' ')"
          allowed='^(android\.permission\.(INTERNET|WAKE_LOCK|FOREGROUND_SERVICE|FOREGROUND_SERVICE_MEDIA_PLAYBACK|POST_NOTIFICATIONS)|com\.jibrilmohamod\.islamic_kids_app\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$'
          extra=$(echo "$perms" | grep -vE "$allowed" || true)
          if [ -n "$extra" ]; then
            echo "::warning title=Unreviewed permission::$(echo "$extra" | tr '\n' ' ')"
          fi

      - name: Build app bundle for Google Play
        if: steps.signing.outputs.signed == 'true'
        working-directory: app
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: islamic-kids-app-aab
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Commit the bundle, lock file and android/ if they changed
        if: env.ON_MAIN == 'true'
        run: |
          git add app/assets/content/bundle.json app/android app/pubspec.lock
          [ -f pipeline/reports/hadith-report.json ] && git add pipeline/reports/hadith-report.json
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update content bundle and generated files [skip ci]"
          echo "::notice title=Left unstaged::$(git status --short | tr '\n' ' ')"
          git push || { git pull --rebase --autostash origin main && git push; }

      # Publishes the bundle to Supabase Storage. Same content gives the same
      # hash and file, so republishing is harmless.
      - name: Publish content to Supabase
        if: env.ON_MAIN == 'true'
        run: |
          set -euo pipefail
          url="$SUPABASE_URL/functions/v1/publish-content"
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PUBLISH_AUDIENCE" | jq -r .value)
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @app/assets/content/bundle.json "$url" > published.json
          echo "::notice title=Published to Supabase::$(cat published.json)"

          # Safety checks: strangers cannot publish, and anyone can read.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" -d '{}')
          [ "$code" = 401 ] || { echo "::error::publish-content accepted an unauthenticated call ($code)"; exit 1; }
          curl -sS --fail "$SUPABASE_URL/storage/v1/object/public/content/v1/manifest.json" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: islamic-kids-app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
