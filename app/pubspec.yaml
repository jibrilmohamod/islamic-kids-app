name: islamic_kids_app
description: Free Islamic learning app for children aged 8 to 12, in Somali and English.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Only first-party flutter.dev packages so far. Check maintenance and licence
# before adding anything else.
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/content/bundle.json
