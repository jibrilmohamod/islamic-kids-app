name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the content pipeline
        run: node --test pipeline/pipeline.test.mjs

      - name: Build the content bundle from QuranEnc and HadeethEnc
        run: |
          node pipeline/build-bundle.mjs | tee pipeline.log
          echo "::notice title=Content bundle::$(tail -n 1 pipeline.log)"

      # Keep the shipped text under version control so every change to it can
      # be reviewed. Only the bundle file is committed; [skip ci] stops a loop.
      - name: Commit the content bundle if it changed
        if: github.event_name != 'pull_request'
        run: |
          # bundleVersion and generatedAt change on every run; commit only when the content changed.
          if git cat-file -e HEAD:app/assets/content/bundle.json 2>/dev/null; then
            git show HEAD:app/assets/content/bundle.json | node pipeline/strip-stamps.mjs > "$RUNNER_TEMP/old.json"
            node pipeline/strip-stamps.mjs < app/assets/content/bundle.json > "$RUNNER_TEMP/new.json"
            if cmp -s "$RUNNER_TEMP/old.json" "$RUNNER_TEMP/new.json"; then
              echo "Content unchanged, nothing to commit"
              exit 0
            fi
          fi
          git add app/assets/content/bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: update bundle from QuranEnc and HadeethEnc [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the Android project files
        working-directory: app
        run: flutter create --platforms android --org com.jibrilmohamod --project-name islamic_kids_app .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: islamic-kids-app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-bundle
          path: app/assets/content/bundle.json
          if-no-files-found: ignore
